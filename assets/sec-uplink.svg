<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="Uplink">
<title>05 // UPLINK</title>
<defs>
  <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0.1"/></linearGradient>
  <filter id="g" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  @keyframes run { 0% { transform:translateX(0); opacity:0 } 10% { opacity:1 } 90% { opacity:1 } 100% { transform:translateX(809.0px); opacity:0 } }
  @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.2 } }
  @keyframes in { from { opacity:0; transform:translateX(-12px) } to { opacity:1; transform:translateX(0) } }
  .pulse { animation:run 3.2s cubic-bezier(.6,0,.4,1) infinite; }
  .blink { animation:blink 1.2s ease-in-out infinite; }
  .in { animation:in .7s ease-out both; }
</style>
<g class="in">
  <path d="M8 14 L40 14 L56 32 L40 50 L8 50 L24 32 Z" fill="#ff2bd6" fill-opacity="0.15" stroke="#ff2bd6" stroke-width="1.5"/>
  <text x="32" y="38" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ff2bd6">05</text>
  <text x="72" y="41" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="20" fill="#5b6b8c">//</text>
  <text x="112" y="42" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="3" fill="#00f0ff" filter="url(#g)">UPLINK</text>
</g>
<line x1="241.0" y1="32" x2="1060" y2="32" stroke="url(#ln)" stroke-width="1.5"/>
<circle class="pulse" cx="241.0" cy="32" r="3.5" fill="#00f0ff" filter="url(#g)"/>
<text x="1192" y="37" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="2" fill="#39ff88" class="blink">[ OPEN ]</text>
</svg>
